version: '3.8'

services:
  backend:
    build:
      context: ./project/backend
      dockerfile: Dockerfile
    container_name: navigatto_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: ./project/frontend
      dockerfile: Dockerfile
    container_name: navigatto_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
